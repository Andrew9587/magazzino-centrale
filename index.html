<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Magazzino Centrale — Accesso</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#10243F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/mgc-theme.css">
<style>
  /* la schermata di login qui e' sempre visibile */
  #login-screen{ display:flex !important; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-emblem">
      <svg viewBox="0 0 24 24" fill="none" stroke="#EAF1F8" stroke-width="1.8"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="login-title">Magazzino Centrale</div>
    <div class="login-sub">Sistema di Gestione Fornitori</div>
    <div class="login-divider"></div>

    <div class="login-error" id="login-error"></div>

    <form id="login-form" autocomplete="off">
      <div class="field">
        <label for="login-livello">Ruolo di accesso</label>
        <select id="login-livello">
          <option value="">— Seleziona —</option>
        </select>
      </div>
      <div class="field">
        <label for="login-user">Utente</label>
        <input type="text" id="login-user" autocomplete="username" placeholder="es. m.rossi">
      </div>
      <div class="field">
        <label for="login-pass">Password</label>
        <input type="password" id="login-pass" autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn-login">Accedi al sistema</button>
    </form>

    <div class="login-hint">
      <div class="lbl">Credenziali demo</div>
      <div class="val" id="login-hint-val">Seleziona un ruolo qui sopra</div>
    </div>

    <div class="login-level-tag">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 2"/></svg>
      Versione a file separati · v2.0.0
    </div>
    <div class="login-foot">I ruoli non ancora migrati appaiono disattivati.</div>
  </div>
</div>

<script src="assets/mgc-core.js"></script>
<script>
(function(){
  'use strict';

  var selLivello = document.getElementById('login-livello');
  var inpUser    = document.getElementById('login-user');
  var inpPass    = document.getElementById('login-pass');
  var boxErr     = document.getElementById('login-error');
  var hint       = document.getElementById('login-hint-val');

  /* Popola la tendina dei ruoli dal core */
  Object.keys(MGC.Auth.LIVELLI).forEach(function(k){
    var cfg = MGC.Auth.LIVELLI[k];
    var opt = document.createElement('option');
    opt.value = k;
    opt.textContent = cfg.nome + (cfg.attivo ? '' : '  (in arrivo)');
    opt.disabled = !cfg.attivo;
    selLivello.appendChild(opt);
  });

  function mostraErrore(msg){
    boxErr.textContent = msg;
    boxErr.style.display = msg ? 'block' : 'none';
  }

  selLivello.addEventListener('change', function(){
    mostraErrore('');
    var cfg = MGC.Auth.LIVELLI[this.value];
    if (cfg && cfg.attivo){
      inpUser.value = cfg.u;
      inpPass.value = cfg.pw;
      hint.textContent = cfg.u + '  /  ' + cfg.pw;
    } else {
      inpUser.value = ''; inpPass.value = '';
      hint.textContent = 'Seleziona un ruolo qui sopra';
    }
  });

  document.getElementById('login-form').addEventListener('submit', function(e){
    e.preventDefault();
    mostraErrore('');

    var raw = selLivello.value;
    if (raw === ''){ mostraErrore('Seleziona il livello di accesso.'); return; }

    var esito = MGC.Auth.verifica(parseInt(raw, 10), inpUser.value.trim(), inpPass.value.trim());
    if (!esito.ok){ mostraErrore(esito.msg); return; }

    MGC.Session.vaiAlLivello({
      livello: esito.livello,
      username: esito.username,
      fornitoreId: esito.fornitoreId,
      nome: esito.nome,
      ts: Date.now()
    });
  });

  /* Se una sessione e' gia' attiva, non riproporre il login */
  var s = MGC.Session.get();
  if (s && MGC.Auth.LIVELLI[s.livello] && MGC.Auth.LIVELLI[s.livello].attivo){
    location.replace(MGC.Auth.LIVELLI[s.livello].page);
  }
})();
</script>
</body>
</html>
