<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Magazzino Centrale — L3 Guardiola</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#10243F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/mgc-theme.css">
<link rel="stylesheet" href="assets/level3.css">
</head>
<body>

<div id="app-l3">

  <!-- ============ TOPBAR ============ -->
  <header class="tb">
    <div class="tb-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="tb-txt">
      <div class="tb-t1">Magazzino Centrale</div>
      <div class="tb-t2">Guardiola</div>
    </div>
    <span class="tb-badge">L3</span>
    <button class="tb-esci" id="btn-esci">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      <span>Esci</span>
    </button>
  </header>

  <div class="wrap">

    <!-- ============ PAGINA OGGI ============ -->
    <section class="page-l3 active" id="page-oggi">
      <div class="h1">Agenda del giorno</div>
      <div class="h1-sub">Appuntamenti confermati in ingresso</div>

      <div class="daynav">
        <button id="d-prev" aria-label="Giorno precedente">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="lbl">
          <div class="d1" id="d-label">—</div>
          <div class="d2" id="d-sub">—</div>
        </div>
        <button id="d-next" aria-label="Giorno successivo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <button class="oggi" id="d-oggi">Oggi</button>
      </div>

      <div class="stats" id="stats"></div>
      <div id="next-box"></div>
      <div id="lista-oggi"></div>
    </section>

    <!-- ============ PAGINA CERCA ============ -->
    <section class="page-l3" id="page-cerca">
      <div class="h1">Cerca fornitore</div>
      <div class="h1-sub">Verifica gli appuntamenti di un fornitore</div>

      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="q" placeholder="Nome fornitore o referente…" autocomplete="off">
      </div>

      <div id="risultati"></div>
    </section>

  </div>

  <!-- ============ BOTTOM NAV ============ -->
  <nav class="bn">
    <button class="bn-item active" data-view="oggi">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span>Oggi</span>
    </button>
    <button class="bn-item" data-view="cerca">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>Cerca</span>
    </button>
  </nav>

</div>

<!-- ============ DETTAGLIO APPUNTAMENTO ============ -->
<div class="ov" id="ov-dett">
  <div class="sheet">
    <div class="sheet-grab"></div>
    <div class="sheet-head">
      <div class="t">Dettaglio ingresso</div>
      <button class="x" data-close aria-label="Chiudi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="dett-body"></div>
    <div id="dett-call"></div>
  </div>
</div>

<script src="assets/mgc-core.js"></script>
<script src="assets/level3.js"></script>
</body>
</html>
